name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hyoo-ru/mam
          path: mam
      - uses: actions/checkout@v4
        with:
          path: mam/airkit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mam
        working-directory: mam
        run: npm install --omit=optional && npm install --no-save jsdom
      - name: Build and test the demo
        working-directory: mam
        run: npx mam airkit/demo
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: mam/airkit/demo/-

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
